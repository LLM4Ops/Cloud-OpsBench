schema_version: 1
system: trainticket
symptom_id: http_request_failure
description: One or more TrainTicket business requests fail with HTTP error responses.
signals:
- alerts report HTTP 4xx or 5xx responses for TrainTicket business actions
- a user-facing or internal business API returns an HTTP error
- alert data includes an entry service, request path, business action, or failed URL
- request failure is observed at the service-call or business-operation level
- pod status alone does not fully explain the request failure
entry:
- service.check_service_route_baseline
nodes:
  service.check_service_route_baseline:
    goal: Establish whether TrainTicket pods, Services, and Endpoints are broadly healthy before treating an HTTP route failure as a gateway or route-rule problem.
    actions:
    - tool: GetResources
      args:
        resource_type: pods
        namespace: <namespace>
    - tool: GetResources
      args:
        resource_type: services
        namespace: <namespace>
    - tool: GetResources
      args:
        resource_type: endpoints
        namespace: <namespace>
    evidence:
    - pod_health_baseline
    - service_discovery_baseline
    - endpoint_baseline
    - alert_summary
    - route_failure_candidates
    - backend_pods_ready
    - service_endpoints_present
    next:
    - service.locate_http_404_route_failure
    - shared.locate_http_5xx_downstream_scope
  service.locate_http_404_route_failure:
    goal: Use active alerts or route-level logs to identify the failing business route, entry service, observed HTTP status, and gateway-facing request path. Treat 404, 500, and 503 as routing signals to be explained by later evidence rather than as final root-cause labels.
    actions:
    - tool: GetAlerts
      args:
        namespace: <namespace>
    evidence:
    - failed_business_route
    - affected_entry_service
    - route_http_status
    - route_level_http_error_signal
    - secondary_failed_routes
    - gateway_service
    next:
    - service.exclude_backend_route_owner_failure
    - service.confirm_gateway_route_misroute
  service.exclude_backend_route_owner_failure:
    goal: 'Check whether the backend associated with the failing route or HTTP error is itself unhealthy,

      misconfigured, or unreachable before attributing the symptom to gateway route mapping.'
    actions:
    - tool: GetResources
      args:
        resource_type: deployments
        namespace: <namespace>
        name: <affected_backend>
    - tool: GetResources
      args:
        resource_type: services
        namespace: <namespace>
        name: <affected_backend>
        output_yaml: true
    - tool: GetErrorLogs
      args:
        namespace: <namespace>
        service_name: <affected_backend>
    evidence:
    - backend_deployment_health
    - backend_service_configuration
    - backend_pod_health
    - backend_connectivity
    - backend_error_logs
    - backend_failure_excluded
    next:
    - service.confirm_gateway_route_misroute
  service.confirm_gateway_route_misroute:
    goal: Compare the failing request path with the gateway route rule and configured backend target to test whether a route-to-backend mismatch explains the observed HTTP error. The HTTP status code is evidence context, not a precondition for this gateway-route check.
    actions:
    - tool: GetAppYAML
      args:
        app_name: <gateway_service>
    evidence:
    - gateway_route_path
    - expected_backend
    - configured_backend
    - route_target_mismatch
    - root_cause_gateway_misrouted
    - root_cause_confirmation
    next: []
  shared.locate_http_5xx_downstream_scope:
    goal: Locate TrainTicket services reporting HTTP 500 or 503 symptoms, while checking pod health to distinguish downstream application failures from startup or CrashLoopBackOff symptoms.
    actions:
    - tool: GetAlerts
      args:
        namespace: <namespace>
    - tool: GetResources
      args:
        resource_type: pods
        namespace: <namespace>
    evidence:
    - affected_services
    - affected_entry_service
    - alert_summary
    - route_http_status
    - http_5xx_symptom
    - pod_health_status
    - pod_health_ok
    - downstream_failure_suspected
    next:
    - shared.trace_http_5xx_downstream_source
    - service.confirm_gateway_route_misroute
  shared.trace_http_5xx_downstream_source:
    goal: Inspect entry-service logs and dependency context to identify which downstream service produces the HTTP 5xx response or service-unavailable symptom.
    actions:
    - tool: GetErrorLogs
      args:
        namespace: <namespace>
        service_name: <entry_service>
    evidence:
    - entry_service_error_logs
    - downstream_failure_source
    - downstream_service_identified
    - suspected_downstream_service
    - service_instance_null
    - downstream_http_500
    - downstream_http_503
    - failure_source
    next:
    - service.confirm_gateway_route_misroute
    - runtime.inspect_downstream_db_write_error
    - service.classify_dns_resolution_failure_logs
  runtime.inspect_downstream_db_write_error:
    goal: Inspect the downstream service that emits HTTP 500 to determine whether the failure is caused by database write rejection or read-only database behavior.
    actions:
    - tool: GetErrorLogs
      args:
        namespace: <namespace>
        service_name: <downstream_service>
    evidence:
    - downstream_error_logs
    - database_write_error
    - sql_error_code
    - read_only_database_error
    - root_cause_evidence
    - root_cause_classified
    next:
    - runtime.confirm_database_readonly_from_logs
  runtime.confirm_database_readonly_from_logs:
    goal: Confirm database read-only mode by retrieving database-side logs after downstream service logs show write statements being rejected.
    actions:
    - tool: GetErrorLogs
      args:
        namespace: <namespace>
        service_name: <mysql_service>
    evidence:
    - database_error_logs_check_result
    - database_readonly_mode
    - database_write_rejected
    - root_cause_confirmation
    next: []
  service.classify_dns_resolution_failure_logs:
    goal: Inspect the failing or restarting service logs for DNS lookup errors, timeout evidence, service instance null messages, or name-resolution failures, preserving whether the same service is partially ready, restarting, or in startup failure.
    actions:
    - tool: GetErrorLogs
      args:
        namespace: <namespace>
        service_name: <failing_service>
    evidence:
    - dns_error_logs
    - dns_resolution_failure_evidence
    - dns_timeout_evidence
    - service_instance_null
    - crash_cause_classification
    - failing_service_identified
    - pod_restart_context
    - repeated_startup_failure
    - pod_partial_ready_or_crashloop_context
    next:
    - service.verify_dns_target_service_exists
  service.verify_dns_target_service_exists:
    goal: Verify that the Service or database target named in DNS errors exists and is reachable, so the diagnosis can distinguish pod-local DNS configuration from a genuinely missing target.
    actions:
    - tool: GetResources
      args:
        resource_type: services
        namespace: <namespace>
    evidence:
    - target_service_exists
    - target_service_endpoints
    - service_reachable
    - missing_service_excluded
    - network_unavailability_excluded
    next:
    - service.confirm_pod_dns_misconfiguration
  service.confirm_pod_dns_misconfiguration:
    goal: Confirm pod-local DNS misconfiguration by inspecting the failing workload YAML for dnsPolicy and custom nameserver configuration after DNS errors are observed, including cases where the misconfiguration causes repeated service restarts or partial readiness.
    actions:
    - tool: GetAppYAML
      args:
        app_name: <failing_service>
    evidence:
    - deployment_dns_config
    - dns_policy
    - custom_nameserver_configured
    - pod_dns_policy_none
    - unreachable_nameserver
    - dns_failure_causes_service_restart
    - root_cause_service_dns_resolution_failure
    - root_cause_confirmation
    - root_cause_confirmed
    next: []
